{% extends "ledger/recipe_base.html" %}

{% block title %}Recipes{% endblock %}

{% block content %}

    <h2>Recipes</h2>

    {% if user.is_authenticated %}
        <a href="{% url 'ledger:recipe_add' %}">Add New Recipe</a>
    {% endif %}

    <ul> 
        {% for r in recipes %} 
            <li><a href="{{ r.get_absolute_url }}">{{r.name}}</a></li>
        {% endfor %}
    </ul> 

{% endblock %}
