{% extends "ledger/recipe_base.html" %}

{% block title %}{{ recipe.name }}{% endblock %}

{% block content %}

    <h2>{{recipe.name}}</h2>
    <h3>Ingredients</h3>

    <ul> 
        {% for item in recipe.ingredients.all %} 
            <li>{{item.ingredient.name}} - {{item.quantity}}</li>
        {% endfor %}
    </ul>    

    <a href="/">Back to List</a>

{% endblock %}
