<!DOCTYPE html>
<html>
    <head>
        <title>{{recipe.name}}</title>
    </head>
<body>
    <h1>Recipe Book</h1>
    <h2>{{recipe.name}}</h2>
    <h3>Ingredients</h3>

<ul> 
    {% for item in recipe.ingredients %} 
    <li>{{item.name}} - {{item.quantity}}</li>
    {% endfor %}
</ul>    

<a href="/">Back to List</a>

</body>
</html>
